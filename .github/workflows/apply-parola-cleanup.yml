name: Apply Parola cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-parola-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Apply source changes
        run: python3 .github/scripts/apply-parola-cleanup.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Parola
        working-directory: parola-src
        run: |
          npm install
          npm run build

      - name: Publish static build
        run: |
          rm -rf parola
          mkdir -p parola
          cp -a parola-src/dist/. parola/
          touch parola/.nojekyll

      - name: Commit changes
        run: |
          rm .github/workflows/apply-parola-cleanup.yml
          rm .github/scripts/apply-parola-cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move Parola inventory to storage and tighten answer keywords"
          git push
