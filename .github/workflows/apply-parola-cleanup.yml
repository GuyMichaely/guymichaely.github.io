name: Apply Parola cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-parola-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Apply source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          storage_path = Path("parola-src/src/storage.ts")
          storage = storage_path.read_text()
          storage = storage.replace('import seedCards from "./data/current-cards.json";\n\n', '')
          initial = '''function initialCards(): Flashcard[] {
            return (seedCards as unknown[]).map(normalizeCard);
          }

          '''
          if initial not in storage:
              raise SystemExit("initialCards block not found")
          storage = storage.replace(initial, '')
          seed_read = '''  if (!stored) {
            const cards = initialCards();
            writeLocalCards(cards);
            return cards;
          }'''
          if seed_read not in storage:
              raise SystemExit("seed read block not found")
          storage = storage.replace(seed_read, '  if (!stored) return [];')
          storage_path.write_text(storage)

          app_path = Path("parola-src/src/App.tsx")
          app = app_path.read_text()
          old_matcher = '''function keywordMatches(value: string, configured: string, aliases: string[]) {
            const normalized = normalizeAnswer(value);
            return [configured, ...aliases].some((candidate) => normalizeAnswer(candidate) === normalized);
          }'''
          new_matcher = '''function keywordMatches(value: string, configured: string, _aliases: string[] = []) {
            return normalizeAnswer(value) === normalizeAnswer(configured);
          }'''
          if old_matcher not in app:
              raise SystemExit("keywordMatches block not found")
          app = app.replace(old_matcher, new_matcher)
          alias_copy = ' <code>s</code>/<code>p</code> are also accepted number aliases.'
          if alias_copy not in app:
              raise SystemExit("answer alias help text not found")
          app = app.replace(alias_copy, '')
          app_path.write_text(app)

          Path("parola-src/src/data/current-cards.json").unlink()

          homepage_path = Path("index.html")
          homepage = homepage_path.read_text()
          dark_style = '''\t\t<style>
\t\t\tbody {
                display: flex;
                min-height: 100vh;
                margin: 0;
                background: #111;
                color: #eee;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
\t\t\ta {
                color: #8ab4f8;
            }
\t\t\ta:visited {
                color: #c58af9;
            }
\t\t\tdiv {
                margin: auto;
            }
\t\t</style>'''
          homepage, count = re.subn(r'\t\t<style>.*?\t\t</style>', dark_style, homepage, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("homepage style block not found")
          homepage_path.write_text(homepage)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Parola
        working-directory: parola-src
        run: |
          npm install
          npm run build

      - name: Publish static build
        run: |
          rm -rf parola
          mkdir -p parola
          cp -a parola-src/dist/. parola/
          touch parola/.nojekyll

      - name: Commit changes
        run: |
          rm .github/workflows/apply-parola-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move Parola inventory to storage and tighten answer keywords"
          git push
