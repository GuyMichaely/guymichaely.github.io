name: Bootstrap Parola

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-parola.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Reconstruct Parola source
        run: |
          cat .parola-bootstrap/source.b64.* | base64 --decode > /tmp/parola.zip
          rm -rf /tmp/parola-unpack parola-src
          mkdir -p /tmp/parola-unpack
          unzip -q /tmp/parola.zip -d /tmp/parola-unpack
          mv /tmp/parola-unpack/parola-static parola-src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build Parola
        working-directory: parola-src
        run: |
          npm install
          npm run build

      - name: Publish under /parola
        run: |
          rm -rf parola
          mkdir -p parola
          cp -a parola-src/dist/. parola/
          touch parola/.nojekyll

      - name: Replace bootstrap with normal source
        run: |
          rm -rf .parola-bootstrap
          rm .github/workflows/bootstrap-parola.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A parola-src parola .parola-bootstrap .github/workflows/bootstrap-parola.yml
          git commit -m "Add Parola static frontend"
          git push
